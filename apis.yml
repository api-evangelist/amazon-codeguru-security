aid: amazon-codeguru-security
name: Amazon CodeGuru Security
description: >-
  Amazon CodeGuru Security is a static application security testing (SAST) service that uses machine learning to detect
  security vulnerabilities in your code. It identifies vulnerabilities such as injection flaws, data exposure risks, and
  infrastructure-as-code misconfigurations, and provides actionable remediation guidance to help developers fix security
  issues quickly.
