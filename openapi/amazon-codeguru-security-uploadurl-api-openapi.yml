security:
- hmac: []
tags:
- name: UploadUrl
paths:
  /uploadUrl:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateUploadUrl
      description: <p>Generates a pre-signed URL and request headers used to upload a code resource.</p> <p>You can upload your code resource to the URL and add the request headers using any HTTP client.</p>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadUrlResponse'
              examples:
                CreateUploadUrl200Example:
                  summary: Default CreateUploadUrl 200 response
                  x-microcks-default: true
                  value:
                    codeArtifactId: '500123'
                    requestHeaders: example-value
                    s3Url: https://example.amazonaws.com
        '480':
          description: InternalServerException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerException'
              examples:
                CreateUploadUrl480Example:
                  summary: Default CreateUploadUrl 480 response
                  x-microcks-default: true
                  value: https://example.amazonaws.com
        '481':
          description: ThrottlingException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThrottlingException'
              examples:
                CreateUploadUrl481Example:
                  summary: Default CreateUploadUrl 481 response
                  x-microcks-default: true
                  value: https://example.amazonaws.com
        '482':
          description: ValidationException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationException'
              examples:
                CreateUploadUrl482Example:
                  summary: Default CreateUploadUrl 482 response
                  x-microcks-default: true
                  value: https://example.amazonaws.com
        '483':
          description: AccessDeniedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessDeniedException'
              examples:
                CreateUploadUrl483Example:
                  summary: Default CreateUploadUrl 483 response
                  x-microcks-default: true
                  value: https://example.amazonaws.com
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scanName
              properties:
                scanName:
                  description: The name of the scan that will use the uploaded resource. CodeGuru Security uses the unique scan name to track revisions across multiple scans of the same resource. Use this <code>scanName</code> when you call <code>CreateScan</code> on the code resource you upload to this URL.
                  type: string
                  pattern: ^[a-zA-Z0-9-_$:.]*$
                  minLength: 1
                  maxLength: 140
            examples:
              CreateUploadUrlRequestExample:
                summary: Default CreateUploadUrl request
                x-microcks-default: true
                value:
                  scanName: example-resource
      summary: Amazon CodeGuru Security Create Upload Url
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - UploadUrl
components:
  parameters:
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  schemas:
    CreateUploadUrlResponse:
      type: object
      required:
      - codeArtifactId
      - requestHeaders
      - s3Url
      properties:
        codeArtifactId:
          allOf:
          - $ref: '#/components/schemas/Uuid'
          - description: 'The identifier for the uploaded code resource. '
        requestHeaders:
          allOf:
          - $ref: '#/components/schemas/RequestHeaderMap'
          - description: A set of key-value pairs that contain the required headers when uploading your resource.
        s3Url:
          allOf:
          - $ref: '#/components/schemas/S3Url'
          - description: A pre-signed S3 URL. You can upload the code file you want to scan and add the required <code>requestHeaders</code> using any HTTP client.
    RequestHeaderMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/HeaderValue'
    ThrottlingException: {}
    S3Url:
      type: string
      minLength: 1
      format: password
    Uuid:
      type: string
      pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
    HeaderValue:
      type: string
      minLength: 1
    AccessDeniedException: {}
    InternalServerException: {}
    ValidationException: {}
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/codeguru-security/
