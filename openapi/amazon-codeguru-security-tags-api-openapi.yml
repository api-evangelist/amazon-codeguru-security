    AccessDeniedException: {}
    TagMap:
      type: object
      minProperties: 0
      maxProperties: 200
      additionalProperties:
        $ref: '#/components/schemas/TagValue'
    ResourceNotFoundException: {}
    TagValue:
      type: string
      minLength: 0
      maxLength: 256
