              examples:
                UntagResource485Example:
                  summary: Default UntagResource 485 response
                  x-microcks-default: true
                  value: example-value
      parameters:
      - name: resourceArn
        in: path
        required: true
        description: The ARN of the <code>ScanName</code> object. You can retrieve this ARN by calling <code>ListScans</code> or <code>GetScan</code>.
        schema:
          type: string
          pattern: ^arn:aws:codeguru-security:[\S]+:[\d]{12}:scans\/[a-zA-Z0-9-_$:.]*$
          minLength: 1
          maxLength: 300
      - name: tagKeys
        in: query
